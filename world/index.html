<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>첫사랑 프로젝트 — 3D 교실 월드</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;font-family:"Pretendard","맑은 고딕",sans-serif;color:#fff}
  #c{display:block;width:100%;height:100%}
  #crosshair{position:fixed;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff8;pointer-events:none;mix-blend-mode:difference}
  #hud{position:fixed;top:12px;left:12px;font-size:14px;color:#ffd9ec;text-shadow:0 1px 3px #000;pointer-events:none}
  #hud b{color:#fff}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,8,18,.92);z-index:10;text-align:center;padding:24px}
  #overlay .box{max-width:460px}
  #overlay h1{font-size:1.8rem;color:#ff9ec2;margin-bottom:10px}
  #overlay p{color:#cfc9d8;line-height:1.7;margin-bottom:8px;font-size:.98rem}
  #overlay .key{display:inline-block;background:#2c2436;border:1px solid #ffffff22;border-radius:6px;padding:2px 9px;margin:2px;font-weight:700}
  #startBtn{margin-top:18px;background:linear-gradient(135deg,#ff5fa2,#ff7db3);color:#fff;border:0;border-radius:14px;padding:14px 30px;font-size:1.05rem;font-weight:800;cursor:pointer}
  #startBtn:disabled{opacity:.5;cursor:default}
  #chat{position:fixed;left:12px;bottom:12px;width:min(380px,46vw);z-index:5}
  #chatlog{max-height:200px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;margin-bottom:6px}
  #chatlog .m{background:#0008;border-radius:8px;padding:4px 9px;font-size:13px;line-height:1.35;width:fit-content;max-width:100%;text-shadow:0 1px 2px #000}
  #chatlog .m b{color:#ff9ec2}
  #chatrow{display:none;gap:6px}
  #chatinput{flex:1;background:#1c1526ee;border:1px solid #ff8fbf55;border-radius:10px;color:#fff;padding:9px 12px;font-size:14px;outline:none}
  #hint{position:fixed;right:12px;bottom:12px;font-size:12px;color:#aaa;text-shadow:0 1px 2px #000;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="crosshair" style="display:none"></div>
<div id="hud" style="display:none">🏙️ 동네 CH.<b id="hChan">-</b> · 접속 <b id="hCount">1</b>/10</div>
<div id="hint" style="display:none">이동 WASD · 질주 <b>Shift</b> · 시점 마우스 · 채팅 <b>Enter</b> · 잠금해제 <b>Esc</b></div>
<button id="backBtn" style="display:none;position:fixed;top:10px;right:12px;z-index:8;background:#1c1526dd;color:#ffd0e4;border:1px solid #ff8fbf66;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer">✕ 게임으로</button>

<div id="chat">
  <div id="chatlog"></div>
  <div id="chatrow"><input id="chatinput" maxlength="200" placeholder="메시지 입력 후 Enter…" autocomplete="off"></div>
</div>

<div id="overlay"><div class="box">
  <h1>🏙️ 3D 동네 오픈월드</h1>
  <p id="ovmsg">접속 준비 중…</p>
  <p style="color:#8d8698;font-size:.88rem">이동 <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
     시점 <span class="key">마우스</span> 채팅 <span class="key">Enter</span></p>
  <button id="startBtn" disabled>입장</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
const API = "https://first-love-api.onrender.com";

// ── 토큰 (게임이 #token=... 로 전달) ──
let TOKEN = "";
if (location.hash.indexOf("token=") >= 0) {
  TOKEN = decodeURIComponent(location.hash.split("token=")[1].split("&")[0]);
  history.replaceState(null, "", location.pathname + location.search); // URL에서 토큰 숨김
}
const H = () => ({ "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json" });

const ov = document.getElementById("overlay");
const ovmsg = document.getElementById("ovmsg");
const startBtn = document.getElementById("startBtn");

// ── three.js 기본 ──
let renderer, scene, camera;
let yaw = 0, pitch = 0;
const keys = {};
let myChannel = 0, running = false;
const EYE = 1.6, SPEED = 4.2;
const ROOM = { x: 58, z: 58 };   // 오픈월드 반경
const clock = new THREE.Clock();
const colliders = [];            // 건물 AABB {minX,maxX,minZ,maxZ}

function facadeTex(base, win) {
  const cv = document.createElement("canvas"); cv.width = 128; cv.height = 160;
  const x = cv.getContext("2d");
  x.fillStyle = base; x.fillRect(0, 0, 128, 160);
  x.fillStyle = win;
  for (let r = 0; r < 6; r++) for (let c = 0; c < 4; c++) x.fillRect(12 + c * 28, 12 + r * 24, 18, 15);
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

// 건물: 박스 + 충돌 등록
function addBuilding(x, z, w, h, d, base, win) {
  const tex = facadeTex(base, win); tex.repeat.set(Math.max(1, w / 6), Math.max(1, h / 6));
  const mat = new THREE.MeshLambertMaterial({ map: tex });
  const roofMat = new THREE.MeshLambertMaterial({ color: 0x6b6470 });
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [mat, mat, roofMat, mat, mat, mat]);
  m.position.set(x, h / 2, z); scene.add(m);
  const pad = 0.5;
  colliders.push({ minX: x - w / 2 - pad, maxX: x + w / 2 + pad, minZ: z - d / 2 - pad, maxZ: z + d / 2 + pad });
  return m;
}

function addTree(x, z) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.24, 1.6, 6),
    new THREE.MeshLambertMaterial({ color: 0x7a5230 }));
  trunk.position.y = 0.8; g.add(trunk);
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(1.1, 10, 8),
    new THREE.MeshLambertMaterial({ color: 0x6fb36f }));
  leaf.position.y = 2.2; g.add(leaf);
  g.position.set(x, 0, z); scene.add(g);
  colliders.push({ minX: x - 0.4, maxX: x + 0.4, minZ: z - 0.4, maxZ: z + 0.4 });
}

function initScene() {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fd0ff);
  scene.fog = new THREE.Fog(0x9fd0ff, 55, 140);

  camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 400);
  camera.position.set(0, EYE, 34);

  scene.add(new THREE.AmbientLight(0xffffff, 0.78));
  const sun = new THREE.DirectionalLight(0xfff2e0, 0.95);
  sun.position.set(20, 40, 15); scene.add(sun);

  // 잔디 바닥
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.x * 2, ROOM.z * 2),
    new THREE.MeshLambertMaterial({ color: 0x8fc47a }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);

  // 도로 (십자 + 광장)
  const road = new THREE.MeshLambertMaterial({ color: 0x55565c });
  const mainRd = new THREE.Mesh(new THREE.PlaneGeometry(10, ROOM.z * 2), road);
  mainRd.rotation.x = -Math.PI / 2; mainRd.position.y = 0.02; scene.add(mainRd);
  const crossRd = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.x * 2, 10), road);
  crossRd.rotation.x = -Math.PI / 2; crossRd.position.y = 0.02; scene.add(crossRd);
  const plaza = new THREE.Mesh(new THREE.PlaneGeometry(26, 20),
    new THREE.MeshLambertMaterial({ color: 0xcfc6b8 }));
  plaza.rotation.x = -Math.PI / 2; plaza.position.set(0, 0.03, -30); scene.add(plaza);

  // 학교 본관 (큰 건물, 북쪽)
  addBuilding(0, -46, 34, 11, 12, "#e9e2d2", "#89b7d6");
  const gateSign = new THREE.Mesh(new THREE.PlaneGeometry(10, 1.4),
    new THREE.MeshBasicMaterial({ color: 0x24406a }));
  gateSign.position.set(0, 6.5, -40); scene.add(gateSign);

  // 상가/동네 건물 (대로 양옆으로 늘어선 상점)
  const palette = [["#d98b8b","#ffe6a0"],["#8bb0d9","#fff3c4"],["#b58bd9","#ffe0ef"],
                   ["#8bd9a0","#fff6d0"],["#d9c58b","#fff0cf"],["#d98bbf","#e8f0ff"]];
  for (let i = 0; i < 7; i++) {
    const z = -14 + i * 7;
    const hL = 6 + (i % 3) * 2, hR = 7 - (i % 2) * 2;
    const pL = palette[i % palette.length], pR = palette[(i + 3) % palette.length];
    addBuilding(-16, z, 9, hL, 9, pL[0], pL[1]);   // 왼쪽 줄
    addBuilding(16, z, 9, hR, 9, pR[0], pR[1]);    // 오른쪽 줄
  }
  // 바깥 블록 몇 채 더
  addBuilding(-34, 10, 12, 9, 12, "#c9b3d9", "#fff2d6");
  addBuilding(34, 6, 12, 10, 12, "#9fcbe0", "#fff6cf");
  addBuilding(30, -20, 10, 7, 10, "#e0b89f", "#fff2d6");
  addBuilding(-30, -22, 10, 8, 10, "#b7d99f", "#fff6d0");

  // 가로수
  for (let i = -5; i <= 5; i++) { if (i === 0) continue; addTree(-7, i * 5); addTree(7, i * 5); }
  addTree(-22, 28); addTree(22, 26); addTree(-26, -6); addTree(26, -4);

  // 벤치(광장)
  for (let i = -1; i <= 1; i++) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.4, 0.6),
      new THREE.MeshLambertMaterial({ color: 0x9a6a3a }));
    b.position.set(i * 6, 0.4, -26); scene.add(b);
  }

  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

function moveAxis(dx, dz) {
  const nx = camera.position.x + dx, nz = camera.position.z + dz;
  if (Math.abs(nx) > ROOM.x - 1 || Math.abs(nz) > ROOM.z - 1) return;
  for (let i = 0; i < colliders.length; i++) {
    const c = colliders[i];
    if (nx > c.minX && nx < c.maxX && nz > c.minZ && nz < c.maxZ) return;
  }
  camera.position.x = nx; camera.position.z = nz;
}

// ── 아바타 ──
const avatars = {};        // username -> {group, target:{x,z,rot}, imgLoaded}
const avatarCache = {};    // username -> texture|null (fetched)
let myName = "";

function makeNameSprite(name) {
  const cv = document.createElement("canvas"); cv.width = 256; cv.height = 64;
  const ctx = cv.getContext("2d");
  ctx.font = "bold 34px sans-serif"; ctx.textAlign = "center";
  ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(0, 0, 256, 64);
  ctx.fillStyle = "#ffd9ec"; ctx.fillText(name, 128, 44);
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
  sp.scale.set(1.6, 0.4, 1); sp.position.y = 2.3; return sp;
}

function placeholderTex() {
  const cv = document.createElement("canvas"); cv.width = 128; cv.height = 256;
  const ctx = cv.getContext("2d");
  const grd = ctx.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0, "#ff9ec2"); grd.addColorStop(1, "#8ecbff");
  ctx.fillStyle = grd; ctx.fillRect(0, 0, 128, 256);
  return new THREE.CanvasTexture(cv);
}

function buildAvatar(name, tex) {
  const g = new THREE.Group();
  const w = 1.0, h = 1.8;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.35, side: THREE.FrontSide });
  const front = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  front.position.y = h / 2; g.add(front);
  const back = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);   // 180° 회전 → 좌우반전된 뒷모습
  back.position.y = h / 2; back.rotation.y = Math.PI; g.add(back);
  g.add(makeNameSprite(name));
  return g;
}

function ensureAvatar(p) {
  if (p.username === myName) return;
  if (!avatars[p.username]) {
    const tex = (avatarCache[p.username] && avatarCache[p.username].tex) || placeholderTex();
    const g = buildAvatar(p.username, tex);
    scene.add(g);
    avatars[p.username] = { group: g, target: { x: p.x, z: p.z, rot: p.rot }, imgLoaded: false };
    g.position.set(p.x, 0, p.z);
    fetchAvatarImg(p.username);
  }
  const a = avatars[p.username];
  a.target.x = p.x; a.target.z = p.z; a.target.rot = p.rot;
}

function fetchAvatarImg(name) {
  if (avatarCache[name] !== undefined) { applyAvatarImg(name); return; }
  avatarCache[name] = null;
  fetch(API + "/world/avatar?username=" + encodeURIComponent(name), { headers: H() })
    .then(r => r.json()).then(j => {
      const raw = j && j.image_b64;
      if (!raw) return;
      let ext = "png", data = raw;
      if (raw.indexOf("|") >= 0) { ext = raw.split("|")[0]; data = raw.split("|")[1]; }
      const img = new Image();
      img.onload = () => {
        const tex = new THREE.Texture(img); tex.needsUpdate = true;
        avatarCache[name] = { tex }; applyAvatarImg(name);
      };
      img.src = "data:image/" + ext + ";base64," + data;
    }).catch(() => {});
}

function applyAvatarImg(name) {
  const a = avatars[name], c = avatarCache[name];
  if (!a || !c || !c.tex || a.imgLoaded) return;
  a.group.traverse(o => { if (o.isMesh && o.material && o.material.map !== undefined) { o.material.map = c.tex; o.material.needsUpdate = true; } });
  a.imgLoaded = true;
}

// ── 네트워킹 ──
let lastChatId = 0, syncFailed = false;

async function syncLoop() {
  if (!running) return;
  try {
    const r = await fetch(API + "/world/sync", {
      method: "POST", headers: H(),
      body: JSON.stringify({ x: camera.position.x, z: camera.position.z, rot: yaw })
    });
    if (r.status === 401 || r.status === 403) { fail("세션이 만료됐어요. 게임에서 다시 열어주세요."); return; }
    const j = await r.json();
    myChannel = j.channel; document.getElementById("hChan").textContent = j.channel;
    const here = {};
    (j.players || []).forEach(p => { here[p.username] = 1; ensureAvatar(p); });
    // 떠난 사람 제거
    Object.keys(avatars).forEach(n => { if (!here[n]) { scene.remove(avatars[n].group); delete avatars[n]; } });
    document.getElementById("hCount").textContent = (j.players || []).length;
    syncFailed = false;
  } catch (e) { syncFailed = true; }
  if (running) setTimeout(syncLoop, 380);
}

async function chatLoop() {
  if (!running) return;
  try {
    if (myChannel) {
      const r = await fetch(API + "/chat/poll?channel=" + myChannel + "&after=" + lastChatId, { headers: H() });
      const j = await r.json();
      (j.messages || []).forEach(m => { addChat(m.username, m.text); lastChatId = m.id; });
    }
  } catch (e) {}
  if (running) setTimeout(chatLoop, 1500);
}

function addChat(name, text) {
  const log = document.getElementById("chatlog");
  const d = document.createElement("div"); d.className = "m";
  d.innerHTML = "<b>" + esc(name) + "</b> " + esc(text);
  log.appendChild(d);
  while (log.children.length > 8) log.removeChild(log.firstChild);
}
function esc(s) { return (s || "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

function sendChat(text) {
  if (!text.trim() || !myChannel) return;
  fetch(API + "/chat/send", { method: "POST", headers: H(), body: JSON.stringify({ channel: myChannel, text: text.trim() }) }).catch(() => {});
}

// ── 입력 / 포인터락 ──
const canvas = document.getElementById("c");
let chatting = false;
const chatrow = document.getElementById("chatrow"), chatinput = document.getElementById("chatinput");

function lockPointer() { if (!chatting) canvas.requestPointerLock(); }
document.addEventListener("pointerlockchange", () => {
  const locked = document.pointerLockElement === canvas;
  document.getElementById("crosshair").style.display = locked ? "block" : "none";
});
canvas.addEventListener("click", () => { if (running && !chatting) lockPointer(); });
document.addEventListener("mousemove", (e) => {
  if (document.pointerLockElement !== canvas) return;
  yaw -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0022;
  pitch = Math.max(-1.2, Math.min(1.2, pitch));
});
addEventListener("keydown", (e) => {
  if (chatting) {
    if (e.key === "Enter") { sendChat(chatinput.value); chatinput.value = ""; toggleChat(false); }
    else if (e.key === "Escape") { chatinput.value = ""; toggleChat(false); }
    return;
  }
  if (e.key === "Enter") { toggleChat(true); e.preventDefault(); return; }
  keys[e.code] = true;
});
addEventListener("keyup", (e) => { keys[e.code] = false; });

function toggleChat(on) {
  chatting = on;
  chatrow.style.display = on ? "flex" : "none";
  if (on) { document.exitPointerLock(); setTimeout(() => chatinput.focus(), 0); }
  else { lockPointer(); }
}

// ── 메인 루프 ──
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (running && !chatting) {
    const fwd = (keys["KeyW"] ? 1 : 0) - (keys["KeyS"] ? 1 : 0);
    const str = (keys["KeyD"] ? 1 : 0) - (keys["KeyA"] ? 1 : 0);
    if (fwd || str) {
      const vx = (Math.sin(yaw) * -fwd + Math.cos(yaw) * str);
      const vz = (Math.cos(yaw) * -fwd - Math.sin(yaw) * str);
      const len = Math.hypot(vx, vz) || 1;
      const sp = SPEED * (keys["ShiftLeft"] ? 1.9 : 1) * dt;   // Shift 질주
      moveAxis((vx / len) * sp, 0);    // 축 분리 이동(벽 따라 미끄러짐)
      moveAxis(0, (vz / len) * sp);
    }
  }
  camera.position.y = EYE;
  const dir = new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
  camera.lookAt(camera.position.x - dir.x, camera.position.y + dir.y, camera.position.z - dir.z);

  // 다른 플레이어 보간
  for (const n in avatars) {
    const a = avatars[n], g = a.group, t = a.target;
    g.position.x += (t.x - g.position.x) * Math.min(1, dt * 8);
    g.position.z += (t.z - g.position.z) * Math.min(1, dt * 8);
    let dr = t.rot - g.rotation.y; while (dr > Math.PI) dr -= 2 * Math.PI; while (dr < -Math.PI) dr += 2 * Math.PI;
    g.rotation.y += dr * Math.min(1, dt * 8);
  }
  if (renderer) renderer.render(scene, camera);
}

// ── 부팅 ──
function fail(msg) { running = false; ov.style.display = "flex"; ovmsg.textContent = msg; startBtn.style.display = "none"; }

async function boot() {
  if (!TOKEN) { ovmsg.innerHTML = "이 월드는 <b>게임에서 '3D 교실'</b> 버튼으로 열어야 해요.<br>(로그인 토큰이 필요합니다)"; return; }
  ovmsg.textContent = "서버 연결 중… (서버가 자고 있으면 최대 1분)";
  try {
    const r = await fetch(API + "/me", { headers: H() });
    if (!r.ok) throw 0;
    const j = await r.json(); myName = j.username || "";
    ovmsg.innerHTML = "준비 완료! <b>" + esc(myName) + "</b> 님, 교실로 입장하세요.";
    startBtn.disabled = false;
  } catch (e) {
    ovmsg.textContent = "서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.";
    setTimeout(boot, 6000);
  }
}

startBtn.addEventListener("click", () => {
  ov.style.display = "none";
  document.getElementById("hud").style.display = "block";
  document.getElementById("hint").style.display = "block";
  document.getElementById("backBtn").style.display = "block";
  running = true;
  lockPointer();
  syncLoop(); chatLoop();
});

// 게임으로 돌아가기 (창 닫기 → Ren'Py 창이 다시 보임)
document.getElementById("backBtn").addEventListener("click", () => {
  try { fetch(API + "/chat/leave", { method: "POST", headers: H(), keepalive: true }); } catch (e) {}
  try { window.close(); } catch (e) {}
  // close가 막히면 안내
  setTimeout(() => { ovmsg.textContent = "이 창을 닫으면 게임으로 돌아갑니다."; ov.style.display = "flex"; startBtn.style.display = "none"; running = false; }, 300);
});

initScene();
animate();
boot();
addEventListener("beforeunload", () => { try { navigator.sendBeacon; fetch(API + "/chat/leave", { method: "POST", headers: H(), keepalive: true }); } catch (e) {} });
</script>
</body>
</html>
